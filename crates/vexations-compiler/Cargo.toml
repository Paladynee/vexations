[package]
name = "vexations-compiler"
version.workspace = true
edition.workspace = true

[features]
default = []
# enable shrink_to_fit after lexing
save_memory = []

[dependencies]
printerator = "1.0.1"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
vexations-generator.workspace = true

[[bench]]
name = "lexer"
harness = false
