[package]
name = "vexations"
version = "0.1.0"
edition = "2024"

[profile.dev]
opt-level = 1
debug = false
debug-assertions = false
overflow-checks = false


[profile.release]
codegen-units = 1
# debug = true
debug-assertions = false
lto = "fat"
opt-level = 3
overflow-checks = false
panic = "abort"
# strip = true
